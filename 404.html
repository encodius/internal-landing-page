<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Encodius</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/instrument-sans-latin.woff2" crossorigin>
    <link rel="stylesheet" href="css/fonts.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Instrument Sans', Helvetica, Arial, sans-serif;
            background: #FFFFFF;
            color: #0A1832;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 500px;
        }
        .error-code {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(5rem, 18vw, 8rem);
            font-weight: 800;
            color: #1D4ED8;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }
        p {
            color: #5C6B84;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 26px;
            background: linear-gradient(135deg, #2F6FED, #1D4ED8);
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 999px;
            box-shadow: 0 10px 24px rgba(29, 78, 216, 0.3);
            transition: box-shadow 0.2s;
        }
        .btn:hover {
            box-shadow: 0 12px 28px rgba(29, 78, 216, 0.42);
        }
        .btn svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <a href="/" class="btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Home
        </a>
    </div>
</body>
</html>
